<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2400" height="1402"
     viewBox="0 0 1536 897"
     preserveAspectRatio="xMidYMid meet"
     aria-labelledby="plan-title plan-desc">
  <title id="plan-title">Plan interactif — Appartement Type D</title>
  <desc id="plan-desc">Plan de l'appartement Type D avec 15 zones interactives.</desc>

  <style>
    svg { background: transparent; }
    .room {
      cursor: pointer;
      outline: none;
    }

    .room-hit {
      fill: rgba(0, 125, 145, 0);
      stroke: rgba(0, 125, 145, 0);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
      transition:
        fill .22s ease,
        stroke .22s ease,
        filter .22s ease;
    }

    .room:hover .room-hit,
    .room:focus .room-hit,
    .room.is-active .room-hit {
      fill: rgba(0, 125, 145, .22);
      stroke: rgba(0, 125, 145, .95);
      filter: drop-shadow(0 0 9px rgba(0, 125, 145, .55));
    }

    .room:focus-visible .room-hit {
      stroke-width: 5;
    }
  </style>

  <g id="interactive-rooms">
    
    <g id="room-01" class="room" role="button" tabindex="0"
       data-room="01" data-name="Toilettes Visiteur" data-area="2.60">
      <title>01 — Toilettes Visiteur — 2.60 m²</title>
      <polygon class="room-hit" points="1085,160 1230,160 1230,236 1085,236" />
    </g>
    <g id="room-02" class="room" role="button" tabindex="0"
       data-room="02" data-name="Arrière Cuisine" data-area="4.82">
      <title>02 — Arrière Cuisine — 4.82 m²</title>
      <polygon class="room-hit" points="1000,160 1230,160 1230,352 1000,352" />
    </g>
    <g id="room-03" class="room" role="button" tabindex="0"
       data-room="03" data-name="Salon &amp; Salle à manger" data-area="58.82">
      <title>03 — Salon &amp; Salle à manger — 58.82 m²</title>
      <polygon class="room-hit" points="485,74 1000,74 1000,352 485,352" />
    </g>
    <g id="room-04" class="room" role="button" tabindex="0"
       data-room="04" data-name="Salle de bain Ch. Parents" data-area="5.57">

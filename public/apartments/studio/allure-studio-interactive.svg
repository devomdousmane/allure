<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2400" height="1230"
     viewBox="0 0 1536 787"
     preserveAspectRatio="xMidYMid meet"
     aria-labelledby="plan-title plan-desc">
  <title id="plan-title">Plan interactif — Studio Allure</title>
  <desc id="plan-desc">Plan du studio avec 9 zones interactives.</desc>

  <style>
    svg { background: transparent; }
    #floorplan-image { pointer-events: none; }
    .room {
      cursor: pointer;
      outline: none;
    }

    .room-hit {
      fill: rgba(0, 125, 145, 0);
      stroke: rgba(0, 125, 145, 0);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
      transition:
        fill .22s ease,
        stroke .22s ease,
        filter .22s ease;
    }

    .room:hover .room-hit,
    .room:focus .room-hit,
    .room.is-active .room-hit {
      fill: rgba(0, 125, 145, .22);
      stroke: rgba(0, 125, 145, .95);
      filter: drop-shadow(0 0 9px rgba(0, 125, 145, .55));
    }

    .room:focus-visible .room-hit {
      stroke-width: 5;
    }
  </style>

  <image id="floorplan-image"
         x="0" y="0" width="1536" height="787"
         preserveAspectRatio="xMidYMid meet"
         href="dimensions-plan-transparent.png" />

  <g id="interactive-rooms">
    
    <g id="room-01" class="room" role="button" tabindex="0"
       data-room="01" data-name="Dégagement" data-area="6.57">
      <title>01 — Dégagement — 6.57 m²</title>
      <polygon class="room-hit" points="1185,375 1325,375 1325,715 1185,715" />
    </g>
    <g id="room-02" class="room" role="button" tabindex="0"
       data-room="02" data-name="Toilettes Visiteur" data-area="2.83">
      <title>02 — Toilettes Visiteur — 2.83 m²</title>
      <polygon class="room-hit" points="1210,95 1325,95 1325,375 1210,375" />
    </g>
    <g id="room-03" class="room" role="button" tabindex="0"
       data-room="03" data-name="Salle de bain Chambre" data-area="6.35">
      <title>03 — Salle de bain Chambre — 6.35 m²</title>
      <polygon class="room-hit" points="1035,95 1210,95 1210,375 1035,375" />
    </g>
    <g id="room-04" class="room" role="button" tabindex="0"
       data-room="04" data-name="Chambre" data-area="19.79">
      <title>04 — Chambre — 19.79 m²</title>
      <polygon class="room-hit" points="545,75 1035,75 1035,375 545,375" />
    </g>
    <g id="room-05" class="room" role="button" tabindex="0"
       data-room="05" data-name="Terrasse" data-area="13.52">
      <title>05 — Terrasse — 13.52 m²</title>
      <polygon class="room-hit" points="205,75 545,75 545,715 205,715" />
    </g>
    <g id="room-06" class="room" role="button" tabindex="0"
       data-room="06" data-name="Machine Climatisation" data-area="0.60">
      <title>06 — Machine Climatisation — 0.60 m²</title>
      <polygon class="room-hit" points="430,665 545,665 545,730 430,730" />
    </g>
    <g id="room-07" class="room" role="button" tabindex="0"
       data-room="07" data-name="Salon" data-area="20.30">
      <title>07 — Salon — 20.30 m²</title>
      <polygon class="room-hit" points="545,375 875,375 875,715 545,715" />
    </g>
    <g id="room-08" class="room" role="button" tabindex="0"
       data-room="08" data-name="Salle à manger" data-area="7.98">
      <title>08 — Salle à manger — 7.98 m²</title>
      <polygon class="room-hit" points="875,375 1185,375 1185,715 875,715" />
    </g>
    <g id="room-09" class="room" role="button" tabindex="0"
       data-room="09" data-name="Kitchnette" data-area="3.75">
      <title>09 — Kitchnette — 3.75 m²</title>
      <polygon class="room-hit" points="955,455 1185,455 1185,715 955,715" />
    </g>
  </g>
</svg>

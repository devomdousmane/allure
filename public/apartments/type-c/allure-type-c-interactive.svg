<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2400" height="1392"
     viewBox="0 0 1536 891"
     preserveAspectRatio="xMidYMid meet"
     aria-labelledby="plan-title plan-desc">
  <title id="plan-title">Plan interactif — Appartement Type C</title>
  <desc id="plan-desc">Plan de l'appartement Type C avec 16 zones interactives.</desc>

  <style>
    svg { background: transparent; }
    .room {
      cursor: pointer;
      outline: none;
    }

    .room-hit {
      fill: rgba(0, 125, 145, 0);
      stroke: rgba(0, 125, 145, 0);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
      transition:
        fill .22s ease,
        stroke .22s ease,
        filter .22s ease;
    }

    .room:hover .room-hit,
    .room:focus .room-hit,
    .room.is-active .room-hit {
      fill: rgba(0, 125, 145, .22);
      stroke: rgba(0, 125, 145, .95);
      filter: drop-shadow(0 0 9px rgba(0, 125, 145, .55));
    }

    .room:focus-visible .room-hit {
      stroke-width: 5;
    }
  </style>

  <g id="interactive-rooms">
    
    <g id="room-01" class="room" role="button" tabindex="0"
       data-room="01" data-name="Toilettes Visiteur" data-area="3.01">
      <title>01 — Toilettes Visiteur — 3.01 m²</title>
      <polygon class="room-hit" points="1380,642 1495,642 1495,855 1380,855" />
    </g>
    <g id="room-02" class="room" role="button" tabindex="0"
       data-room="02" data-name="Salon et Salle à manger" data-area="69.60">
      <title>02 — Salon et Salle à manger — 69.60 m²</title>
      <polygon class="room-hit" points="340,492 855,492 855,855 340,855" />
    </g>

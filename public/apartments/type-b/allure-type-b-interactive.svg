<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2400" height="1328"
     viewBox="0 0 1536 850"
     preserveAspectRatio="xMidYMid meet"
     aria-labelledby="plan-title plan-desc">
  <title id="plan-title">Plan interactif — Appartement Type B</title>
  <desc id="plan-desc">Plan de l'appartement Type B avec 22 zones interactives.</desc>

  <style>
    svg { background: transparent; }
    #floorplan-image { pointer-events: none; }
    .room {
      cursor: pointer;
      outline: none;
    }
    .room-hit {
      fill: rgba(0, 125, 145, 0);
      stroke: rgba(0, 125, 145, 0);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
      transition: fill .22s ease, stroke .22s ease, filter .22s ease;
    }
    .room:hover .room-hit,
    .room:focus .room-hit,
    .room.is-active .room-hit {
      fill: rgba(0, 125, 145, .22);
      stroke: rgba(0, 125, 145, .95);
      filter: drop-shadow(0 0 9px rgba(0, 125, 145, .55));
    }
    .room:focus-visible .room-hit {
      stroke-width: 5;
    }
  </style>

  <image id="floorplan-image"
         x="0" y="0" width="1536" height="834"
         preserveAspectRatio="xMidYMid meet"
         href="dimensions-plan-transparent.png" />

  <g id="interactive-rooms">
    
    <g id="room-01" class="room" role="button" tabindex="0"
       data-room="01" data-name="Hall Entrée" data-area="4.77">
      <title>01 — Hall Entrée — 4.77 m²</title>
      <polygon class="room-hit" points="904,72 1028,72 1028,212 904,212" />
    </g>

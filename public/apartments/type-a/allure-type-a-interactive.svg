  <style>
    svg { background: transparent; }
    .room {
      cursor: pointer;
      outline: none;
    }
    .room-hit {
      fill: rgba(0, 125, 145, 0);
      stroke: rgba(0, 125, 145, 0);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
      transition: fill .22s ease, stroke .22s ease, filter .22s ease;
    }
    .room:hover .room-hit,
    .room:focus .room-hit,
    .room.is-active .room-hit {
      fill: rgba(0, 125, 145, .22);
      stroke: rgba(0, 125, 145, .95);
      filter: drop-shadow(0 0 9px rgba(0, 125, 145, .55));
    }
    .room:focus-visible .room-hit {
      stroke-width: 5;
    }
  </style>

